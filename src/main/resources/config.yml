# BountyHunt - Main Configuration

storage:
  type: SQLITE # SQLITE or MYSQL
  mysql:
    host: localhost
    port: 3306
    database: bountyhunt
    username: root
    password: ''
    use-ssl: false

settings:
  # General settings
  bounty:
    min-amount: 100.0
    max-amount: 1000000.0
    tax-percentage: 10.0 # Fee taken by the server
    allow-self-bounty: false
    
  # Live Wanted Status
  wanted-status:
    enabled: true
    bossbar:
      enabled: true
      text: "<red><bold>WANTED:</bold> %player% <gray>(Reward: %amount%)"
      color: RED
      style: SOLID
    actionbar:
      enabled: true
      text: "<red>⚠ You are currently WANTED! ⚠"
    particles:
      enabled: true
      type: FLAME
      interval-ticks: 20
    visibility-range: 50

  # Reputation System
  reputation:
    enabled: true
    ranks:
      ROOKIE:
        threshold: 0
        display: "<gray>Rookie"
      HUNTER:
        threshold: 10
        display: "<green>Hunter"
      ASSASSIN:
        threshold: 50
        display: "<dark_red>Assassin"
      LEGEND:
        threshold: 200
        display: "<gold><bold>Bounty Legend"

  # Insurance System
  insurance:
    enabled: true
    cost: 500.0
    duration-minutes: 30
